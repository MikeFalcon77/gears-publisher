# Installed by provision.sh as /etc/systemd/resolved.conf.d/no-search-domain.conf.
#
# Virtuozzo sets the environment's domain as the search domain, and its DNS answers
# every name under that domain with its load balancer (which answers HTTP 500). A name
# that does not exist, such as gears-rust's test host `unreachable.invalid` (RFC 6761),
# then resolves instead of failing. An empty Domains= drops the search domain; the
# host's own names come from /etc/hosts.
[Resolve]
Domains=

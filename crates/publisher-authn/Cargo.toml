[package]
name = "publisher-authn"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Derived from cf-gears-firebase-authn-plugin 0.2.3 (Constructor Fabric, Apache-2.0).
license = "Apache-2.0"
description = "AuthN resolver plugin admitting any verified Firebase user; the publisher decides access"

[lints]
workspace = true

[dependencies]
toolkit.workspace = true
toolkit-macros.workspace = true
toolkit-security = { workspace = true, features = ["jwt"] }
toolkit-http = { package = "cf-gears-toolkit-http", version = "=0.9.1" }
toolkit-gts = { package = "cf-gears-toolkit-gts", version = "=0.3.0" }
authn-resolver-sdk = { package = "cf-gears-authn-resolver-sdk", version = "=0.3.44" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "=0.5.3", features = ["rest-client"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "use_pem"] }
anyhow.workspace = true
async-trait.workspace = true
http.workspace = true
inventory.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
toolkit = { workspace = true, features = ["test-support"] }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "=0.5.3", features = ["test-util"] }
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
base64.workspace = true
chrono.workspace = true
rsa = "0.9.10"

# gears-publisher application configuration.
#
# Environment (see .env.example):
#   DATABASE_URL          PostgreSQL DSN (engine journal, queue, run log)
#   FIREBASE_PROJECT_ID   Firebase project whose ID tokens are accepted
#   PUBLISHER_WORK_DIR    clone, per-run files            (default /var/lib/gears-publisher)
#   PUBLISHER_TARGET_DIR  shared CARGO_TARGET_DIR         (default <work>/target)
#   PUBLISHER_SECRETS     KEY=value file with CARGO_REGISTRY_TOKEN
#   PUBLISHER_WEB_ROOT    built UI                         (default web/dist)
#   PUBLISHER_BIND        listen address, applied by the binary (default 127.0.0.1:8080)
#   PUBLISHER_RUN_AS      build user for the release's commands (empty: the service user)
#   PUBLISHER_CI_RUN_AS   build user for PR CI, a PR's code (required when RUN_AS is set)
#   PUBLISHER_CI_WORK_DIR PR CI clone and target           (default <work>/pr-ci)
#   PUBLISHER_CI_MIRROR   the service's bare mirror of PRs (default <work>/pr-mirror.git)

server:
  home_dir: "~/.gears-publisher"   # ${VAR} is not expanded here

database:
  servers:
    primary:
      engine: postgres
      dsn: "${DATABASE_URL}"
      pool:
        max_conns: 10
        acquire_timeout: 30s

logging:
  default:
    console_level: info
  sqlx:
    console_level: warn

gears:
  api-gateway:
    config:
      bind_addr: "127.0.0.1:8080"  # PUBLISHER_BIND overrides
      auth_disabled: false
      require_auth_by_default: true
      enable_docs: false
      cors_enabled: false
      openapi:
        title: gears-publisher
        version: 0.1.0

  types-registry:
    database:
      server: primary
    config: {}

  authn-resolver:
    config:
      vendor: constructorfabric

  # Admits every verified Firebase user (Google, GitHub); the publisher gear decides
  # what each may do: config admins, approved users, or a request for access.
  publisher-authn-plugin:
    config:
      project_id: "${FIREBASE_PROJECT_ID}"
      # The tenant of every subject; equals the publisher's run tenant.
      tenant_id: "67656172-732d-7075-626c-697368657201"

  publisher:
    database:
      server: primary
    config:
      work_dir: "${PUBLISHER_WORK_DIR:-/var/lib/gears-publisher}"
      target_dir: "${PUBLISHER_TARGET_DIR:-/var/lib/gears-publisher/target}"
      secrets_file: "${PUBLISHER_SECRETS:-/etc/gears-publisher/secrets.env}"
      web_root: "${PUBLISHER_WEB_ROOT:-web/dist}"
      python: "${PUBLISHER_PYTHON:-python3}"
      # Absolute CARGO_HOME whose registry and git are cleared before each release
      # (release-plz.yml does the same); empty: keep them (local development).
      clean_cargo_home: "${PUBLISHER_CLEAN_CARGO_HOME:-}"
      queue_dsn: "${DATABASE_URL}"
      firebase_project_id: "${FIREBASE_PROJECT_ID}"
      # Admins: they start releases and approve access requests on /admin. Firebase
      # uid + email (the email only names them). Everyone else asks for access in the
      # UI and, once approved, may run PR CI and read releases.
      admins:
        - uid: "REPLACE_WITH_FIREBASE_UID"
          email: "someone@example.com"
      # Build user for everything that runs gears-rust's code (sudo -u); empty locally.
      run_as: "${PUBLISHER_RUN_AS:-}"
      # PR CI runs a pull request's code: as its own user, in its own clone and target,
      # so that it cannot reach the release's. Checks get only GITHUB_CI_TOKEN (a
      # read-only token, optional) from secrets_file, never the gh login.
      ci_run_as: "${PUBLISHER_CI_RUN_AS:-}"
      ci_work_dir: "${PUBLISHER_CI_WORK_DIR:-}"
      ci_mirror_dir: "${PUBLISHER_CI_MIRROR:-}"
      # Git dependencies PR checks fetch from elsewhere (git `insteadOf`). GitHub has
      # flagged constructorfabric: its public cargo-gears (make dylint) answers 404 to
      # anonymous git, so a public fork stands in. The fork must carry the tag
      # gears-rust pins.
      ci_git_rewrites:
        "https://github.com/constructorfabric/cargo-gears": "https://github.com/MikeFalcon77/cargo-gears"
      # `checks` defaults to gears-rust's ci.yml jobs without Docker (see config.rs).
      env:
        CARGO_BUILD_JOBS: "${PUBLISHER_CARGO_JOBS:-12}"
        # gears-rust's Makefile installs git hooks into the clone otherwise.
        GEARS_NO_HOOKS: "1"
